<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Выбор голосовой сессии</title><link rel="stylesheet" href="/style.css"><script src="/config.js"></script>
</head>
<body>
  <main>
    <div id="status" class="status" role="status" aria-live="polite">Подключаемся к серверу…</div>

  </main>
  <script src="/listen.js"></script>
</body>
</html>
